<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream HUD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: 800;
            color: #ffffff;
            overflow: hidden;
            background: transparent;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }
        #hud {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
        }
        .timer-pill {
            background: rgba(12, 14, 24, 0.85);
            border: 2px solid #FFC740;
            border-radius: 999px;
            padding: 10px 28px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            min-width: 260px;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        .timer-pill.warning { border-color: #FFD700; box-shadow: 0 0 18px rgba(255,215,0,0.45); }
        .timer-pill.danger { border-color: #FF4444; box-shadow: 0 0 22px rgba(255,68,68,0.55); }
        .timer-label {
            font-size: 11px;
            letter-spacing: 1.2px;
            color: #FFC740;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        #timer {
            font-size: 38px;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .goal-wrap {
            margin-top: 10px;
            width: 280px;
            background: rgba(12, 14, 24, 0.85);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.45);
        }
        .goal-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 6px;
        }
        .goal-bar {
            position: relative;
            height: 10px;
            background: rgba(255,255,255,0.12);
            border-radius: 999px;
            overflow: visible;
        }
        .goal-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFC740, #FFEA9F);
            border-radius: 999px;
            width: 0%;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }
        .goal-tick {
            position: absolute;
            top: -3px;
            width: 2px;
            height: 16px;
            background: rgba(255,255,255,0.35);
        }
        .ticker-wrap {
            margin-top: 10px;
            width: 280px;
            background: rgba(12, 14, 24, 0.85);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.45);
        }
        .ticker-title {
            font-size: 10px;
            color: #FFC740;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .ticker-item {
            font-size: 13px;
            color: #50E678;
            margin-bottom: 4px;
            animation: fadeIn 0.4s ease;
        }
        .leaderboard-wrap {
            margin-top: 10px;
            width: 280px;
            background: rgba(12, 14, 24, 0.85);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.45);
        }
        .leaderboard-title {
            font-size: 10px;
            color: #FFC740;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 3px;
        }
        .leaderboard-row .name { color: #ffffff; }
        .leaderboard-row .amount { color: #50E678; }
        .flyin {
            position: fixed;
            font-size: 26px;
            color: #50E678;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 9999;
            font-weight: 900;
        }
        @keyframes flyToTimer {
            0% { opacity: 1; transform: scale(0.7); }
            20% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0; transform: scale(1) translate(var(--tx), var(--ty)); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="timer-pill" id="timerPill">
            <div class="timer-label">STREAM TIME &nbsp; RM1 = +<span id="mprLabel">5</span> MIN</div>
            <div id="timer">03:00:00</div>
        </div>

        <div class="goal-wrap">
            <div class="goal-header">
                <span>GOAL</span>
                <span id="goalText">RM0 / RM50</span>
            </div>
            <div class="goal-bar" id="goalBar"></div>
        </div>

        <div class="ticker-wrap">
            <div class="ticker-title">Recent Donations</div>
            <div id="ticker"></div>
        </div>

        <div class="leaderboard-wrap">
            <div class="leaderboard-title">Top Boosters</div>
            <div id="leaderboard"></div>
        </div>
    </div>

    <script>
        const LS_KEY = 'float_overlay_hud_state_v1';

        let state = {
            remainingSeconds: 3 * 60 * 60,
            totalDonatedRM: 0,
            goalRM: 50,
            minutesPerRM: 5,
            capHours: 3,
            recent: [],
            boosters: {}
        };

        function loadState() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) {
                    const saved = JSON.parse(raw);
                    state = { ...state, ...saved };
                }
            } catch (e) {}
        }

        function saveState() {
            try {
                localStorage.setItem(LS_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        function capSeconds() {
            return state.capHours * 3600;
        }

        function formatTime(seconds) {
            seconds = Math.max(0, Math.floor(seconds));
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function updateTimerVisuals() {
            document.getElementById('timer').textContent = formatTime(state.remainingSeconds);
            const pill = document.getElementById('timerPill');
            pill.classList.remove('warning', 'danger');
            const minutes = state.remainingSeconds / 60;
            if (minutes <= 3) pill.classList.add('danger');
            else if (minutes <= 10) pill.classList.add('warning');
        }

        function updateGoal() {
            document.getElementById('mprLabel').textContent = state.minutesPerRM;
            document.getElementById('goalText').textContent = `RM${state.totalDonatedRM.toFixed(2)} / RM${state.goalRM}`;
            const pct = Math.min(100, (state.totalDonatedRM / state.goalRM) * 100);
            const bar = document.getElementById('goalBar');
            bar.innerHTML = `<div class="goal-fill" style="width:${pct}%"></div>`;
            for (let i = 1; i <= 4; i++) {
                const tickPct = (i / 5) * 100;
                bar.innerHTML += `<div class="goal-tick" style="left:${tickPct}%"></div>`;
            }
        }

        function updateTicker() {
            const el = document.getElementById('ticker');
            el.innerHTML = state.recent.slice(0, 5).map(r =>
                `<div class="ticker-item">${r.name} +RM${r.amount.toFixed(2)}</div>`
            ).join('');
        }

        function updateLeaderboard() {
            const el = document.getElementById('leaderboard');
            const sorted = Object.entries(state.boosters)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3);
            if (sorted.length === 0) {
                el.innerHTML = '<div class="leaderboard-row"><span class="name">No donations yet</span></div>';
                return;
            }
            el.innerHTML = sorted.map(([name, amount], i) =>
                `<div class="leaderboard-row"><span class="name">#${i+1} ${name}</span><span class="amount">RM${amount.toFixed(2)}</span></div>`
            ).join('');
        }

        function render() {
            updateTimerVisuals();
            updateGoal();
            updateTicker();
            updateLeaderboard();
        }

        function flyInAnimation(amount) {
            const addedMinutes = amount * state.minutesPerRM;
            const addedSeconds = addedMinutes * 60;
            const m = Math.floor(addedSeconds / 60);
            const s = addedSeconds % 60;
            const text = `+${m}:${s.toString().padStart(2,'0')}`;

            const fly = document.createElement('div');
            fly.className = 'flyin';
            fly.textContent = text;
            const startX = window.innerWidth * 0.5 + (Math.random() * 80 - 40);
            const startY = window.innerHeight * 0.35;
            const endX = window.innerWidth * 0.5 - startX;
            const endY = window.innerHeight * 0.08 - startY;
            fly.style.left = startX + 'px';
            fly.style.top = startY + 'px';
            fly.style.setProperty('--tx', endX + 'px');
            fly.style.setProperty('--ty', endY + 'px');
            fly.style.animation = 'flyToTimer 1.2s ease forwards';
            document.body.appendChild(fly);
            setTimeout(() => fly.remove(), 1200);
        }

        window.onDonation = function(name, amountRM) {
            if (!name || !amountRM || amountRM <= 0) return;
            const addedSeconds = amountRM * state.minutesPerRM * 60;
            state.remainingSeconds = Math.min(capSeconds(), state.remainingSeconds + addedSeconds);
            state.totalDonatedRM += amountRM;
            state.recent.unshift({ name: name, amount: amountRM, time: Date.now() });
            state.recent = state.recent.slice(0, 10);
            state.boosters[name] = (state.boosters[name] || 0) + amountRM;
            saveState();
            flyInAnimation(amountRM);
            setTimeout(render, 150);
        };

        window.setGoal = function(rm) {
            state.goalRM = Math.max(1, Number(rm) || 50);
            saveState();
            render();
        };

        window.setMinutesPerRM = function(m) {
            state.minutesPerRM = Math.max(1, Number(m) || 5);
            saveState();
            render();
        };

        window.setCapHours = function(h) {
            state.capHours = Math.max(1, Number(h) || 3);
            state.remainingSeconds = Math.min(state.remainingSeconds, capSeconds());
            saveState();
            render();
        };

        window.resetAll = function() {
            state.remainingSeconds = capSeconds();
            state.totalDonatedRM = 0;
            state.recent = [];
            state.boosters = {};
            saveState();
            render();
        };

        loadState();
        state.remainingSeconds = Math.min(state.remainingSeconds, capSeconds());
        render();

        setInterval(() => {
            if (state.remainingSeconds > 0) {
                state.remainingSeconds--;
                saveState();
                updateTimerVisuals();
            }
        }, 1000);
    </script>
</body>
</html>
