<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOMSTREAM Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #111;
      border-bottom: 1px solid #333;
    }
    #status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #666;
    }
    #status-dot.live { background: #ff3b30; box-shadow: 0 0 6px #ff3b30; }
    #status-dot.connecting { background: #ffcc00; }
    #status-dot.connected { background: #34c759; }
    #video-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }
    button {
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { background: rgba(255,255,255,0.15); }
    #latency {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #ccc;
      display: none;
    }
  </style>
</head>
<body>
  <div id="audioOverlay" style="
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.85); z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      color:#fff; font-family:system-ui; text-align:center;
  ">
      <div style="font-size:24px; margin-bottom:12px;">&#128263; Stream Audio Muted</div>
      <div style="font-size:14px; opacity:0.7; margin-bottom:24px;">Browsers require a click to play audio</div>
      <button id="enableAudioBtn" style="
          padding:14px 32px; font-size:16px; border:none; border-radius:8px;
          background:#ff0050; color:#fff; cursor:pointer;
      ">Tap to Enable Audio</button>
  </div>

  <div id="container">
    <div id="header">
      <div id="status"><span id="status-dot"></span><span id="status-text">Offline</span></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#888;">
        <label for="syncSlider">Audio sync</label>
        <input type="range" id="syncSlider" min="-500" max="500" step="10" value="0" style="width:100px;">
        <span id="syncValue">0ms</span>
        <span style="margin-left:8px;">ZOMSTREAM</span>
      </div>
    </div>
    <div id="video-wrap">
      <video id="remoteVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:contain;"></video>
      <div id="latency">Latency: -- ms</div>
      <div id="controls">
        <button id="fitBtn">Fill</button>
        <button id="muteBtn">Unmute</button>
        <button id="fullscreenBtn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const video = document.getElementById('remoteVideo');
    const latencyEl = document.getElementById('latency');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fitBtn = document.getElementById('fitBtn');
    const muteBtn = document.getElementById('muteBtn');

    let fitMode = 'contain';
    fitBtn.textContent = 'Fill';
    fitBtn.addEventListener('click', () => {
      fitMode = fitMode === 'contain' ? 'cover' : 'contain';
      video.style.objectFit = fitMode;
      fitBtn.textContent = fitMode === 'contain' ? 'Fill' : 'Fit';
    });

    function setStatus(state, text) {
      statusDot.className = '';
      statusDot.classList.add(state);
      statusText.textContent = text;
    }

    fullscreenBtn.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    });

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? 'Unmute' : 'Mute';
    });

    // Guarded manual play — only fires when the element is actually ready,
    // avoiding AbortError from overlapping play() / load() requests.
    function safePlay() {
      if (video.paused && video.readyState >= 2) {
        video.play().catch((e) => {
          console.log('Video play delayed:', e.message);
        });
      }
    }
    video.addEventListener('loadedmetadata', safePlay);
    video.addEventListener('canplay', safePlay);

    // ------------------------------------------------------------------
    // Audio pipeline
    //
    // The phone sends raw 48kHz stereo PCM in 10ms chunks over a WebRTC data
    // channel (unordered, no retransmits). Scheduling one AudioBufferSource
    // per chunk clicks on jitter and drifts out of sync over time, so
    // instead the chunks feed a ring buffer inside an AudioWorklet:
    //   - chunks are re-inserted in capture-timestamp order (channel is unordered)
    //   - capture-time gaps become inserted silence (preserves A/V sync)
    //   - a target buffer (default 150ms, sync-slider adjustable) absorbs jitter
    //   - overflow trims back to target (absorbs clock drift between devices)
    //   - underruns ramp to silence instead of clicking
    // ------------------------------------------------------------------
    const SAMPLE_RATE = 48000;
    const CHANNELS = 2;
    const SAMPLES_PER_10MS = SAMPLE_RATE / 100;
    const BYTES_PER_CHUNK = SAMPLES_PER_10MS * CHANNELS * 2;
    const BASE_BUFFER_MS = 150;

    const AUDIO_WORKLET_CODE = `
class PcmPlayerProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.queue = [];
    this.frames = 0;
    this.started = false;
    this.targetFrames = Math.round(sampleRate * 0.15);
    this.maxFrames = Math.round(sampleRate * 0.8);
    this.nextSeq = null;
    this.gapFrames = 0;
    this.fade = 0;
    this.prevL = 0;
    this.prevR = 0;
    // Phone chunks are always 10ms of 48kHz audio; convert to this context's rate.
    this.chunkFrames = Math.max(1, Math.round(480 * sampleRate / 48000));
    this.port.onmessage = (e) => {
      const m = e.data;
      if (m.type === 'push') {
        this.insertChunk(m.seq, this.resample(m.left), this.resample(m.right));
      } else if (m.type === 'target') {
        this.setTarget(m.frames);
      } else if (m.type === 'reset') {
        this.queue = [];
        this.frames = 0;
        this.started = false;
        this.nextSeq = null;
        this.gapFrames = 0;
        this.fade = 0;
        this.prevL = 0;
        this.prevR = 0;
      }
    };
  }

  // Linear-interpolation resample of one 48kHz channel buffer to the
  // AudioContext's actual rate — the {sampleRate: 48000} hint is not always
  // honored, and playing 48kHz data at another rate causes constant
  // buffer growth and pulsing drop-trims.
  resample(src) {
    const dstLen = this.chunkFrames;
    if (src.length === dstLen) return src;
    const out = new Float32Array(dstLen);
    const step = src.length / dstLen;
    for (let i = 0; i < dstLen; i++) {
      const pos = i * step;
      const i0 = Math.floor(pos);
      const frac = pos - i0;
      const i1 = Math.min(i0 + 1, src.length - 1);
      out[i] = src[i0] + (src[i1] - src[i0]) * frac;
    }
    return out;
  }

  setTarget(frames) {
    this.targetFrames = Math.max(Math.round(sampleRate * 0.03), frames);
    this.maxFrames = Math.max(this.targetFrames * 2, Math.round(sampleRate * 0.6));
    if (this.frames > this.maxFrames) this.trimOverflow();
  }

  insertChunk(seq, left, right) {
    // Keep the queue sorted by sequence number (channel is unordered).
    let lo = 0;
    let hi = this.queue.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (this.queue[mid].seq < seq) lo = mid + 1; else hi = mid;
    }
    // Drop exact duplicates.
    if (lo > 0 && this.queue[lo - 1].seq === seq) return;
    if (lo < this.queue.length && this.queue[lo].seq === seq) return;
    this.queue.splice(lo, 0, { seq, left, right });
    this.frames += left.length;
    if (this.frames > this.maxFrames) this.trimOverflow();
  }

  trimOverflow() {
    // Latency/drift control: drop oldest audio back down to target.
    let drop = this.frames - this.targetFrames;
    while (drop > 0 && this.queue.length > 0) {
      const c = this.queue[0];
      if (c.left.length <= drop) {
        drop -= c.left.length;
        this.frames -= c.left.length;
        this.queue.shift();
      } else {
        c.left = c.left.subarray(drop);
        c.right = c.right.subarray(drop);
        this.frames -= drop;
        drop = 0;
      }
    }
    // Skipped audio must not be mistaken for lost packets afterwards.
    this.nextSeq = this.queue.length > 0 ? this.queue[0].seq : null;
  }

  process(inputs, outputs) {
    const out = outputs[0];
    const L = out && out[0];
    const R = out && out[1];
    // Some browsers hand a zero-channel output buffer when the node is not
    // fully configured — bail out instead of crashing the worklet.
    if (!L || !R) {
      return true;
    }
    const n = L.length;

    if (!this.started) {
      if (this.frames < this.targetFrames) {
        L.fill(0);
        R.fill(0);
        return true;
      }
      this.started = true;
      this.fade = 64; // fade in after silence so resuming doesn't click
      this.nextSeq = this.queue.length > 0 ? this.queue[0].seq : null;
    }

    let i = 0;
    while (i < n) {
      // Fill lost-packet gaps with silence so timing matches the phone.
      if (this.gapFrames > 0) {
        const m = Math.min(this.gapFrames, n - i);
        for (let k = 0; k < m; k++) { L[i + k] = 0; R[i + k] = 0; }
        this.gapFrames -= m;
        i += m;
        if (this.gapFrames === 0) this.fade = 48; // fade back in
        continue;
      }

      const c = this.queue[0];
      if (!c) {
        // Underrun: ramp out to silence, then re-buffer before resuming.
        const ramp = Math.min(64, n - i);
        for (let k = 0; k < ramp; k++) {
          const g = 1 - (k + 1) / (ramp + 1);
          L[i + k] = this.prevL * g;
          R[i + k] = this.prevR * g;
        }
        for (let k = i + ramp; k < n; k++) { L[k] = 0; R[k] = 0; }
        this.prevL = 0;
        this.prevR = 0;
        this.started = false;
        this.nextSeq = null;
        return true;
      }

      // Sequence bookkeeping: discard stale chunks, silence missing ones.
      if (this.nextSeq === null) {
        this.nextSeq = c.seq;
      } else if (c.seq < this.nextSeq) {
        this.frames -= c.left.length;
        this.queue.shift();
        continue;
      } else if (c.seq > this.nextSeq) {
        const missing = c.seq - this.nextSeq;
        this.gapFrames = Math.min(missing * this.chunkFrames, sampleRate);
        this.nextSeq = c.seq;
        continue;
      }

      const m = Math.min(n - i, c.left.length);
      for (let k = 0; k < m; k++) {
        let vL = c.left[k];
        let vR = c.right[k];
        if (this.fade > 0) {
          const g = 1 - this.fade / 64;
          vL *= g;
          vR *= g;
          this.fade--;
        }
        L[i + k] = vL;
        R[i + k] = vR;
        this.prevL = vL;
        this.prevR = vR;
      }
      i += m;
      this.frames -= m;
      if (m === c.left.length) {
        this.queue.shift();
        this.nextSeq = c.seq + 1;
      } else {
        c.left = c.left.subarray(m);
        c.right = c.right.subarray(m);
      }
    }
    return true;
  }
}
registerProcessor('pcm-player', PcmPlayerProcessor);
`;

    // AudioContext is created only inside a user gesture (the overlay click),
    // otherwise the browser blocks it with an autoplay policy error.
    let audioCtx = null;
    let audioWorkletNode = null;

    let syncOffsetMs = 0; // user-adjustable A/V sync offset

    const syncSlider = document.getElementById('syncSlider');
    const syncValue = document.getElementById('syncValue');

    function applyAudioTarget() {
      if (!audioWorkletNode) return;
      const targetMs = Math.min(800, Math.max(30, BASE_BUFFER_MS + syncOffsetMs));
      audioWorkletNode.port.postMessage({
        type: 'target',
        frames: Math.round(targetMs * SAMPLE_RATE / 1000),
      });
    }

    syncSlider.addEventListener('input', () => {
      syncOffsetMs = parseInt(syncSlider.value, 10);
      syncValue.textContent = `${syncOffsetMs}ms`;
      applyAudioTarget();
    });

    const audioOverlay = document.getElementById('audioOverlay');
    const enableAudioBtn = document.getElementById('enableAudioBtn');

    enableAudioBtn.addEventListener('click', async () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
        try {
          const workletUrl = URL.createObjectURL(new Blob([AUDIO_WORKLET_CODE], { type: 'application/javascript' }));
          await audioCtx.audioWorklet.addModule(workletUrl);
          URL.revokeObjectURL(workletUrl);
          audioWorkletNode = new AudioWorkletNode(audioCtx, 'pcm-player', {
            numberOfInputs: 0,
            numberOfOutputs: 1,
            outputChannelCount: [2],
          });
          audioWorkletNode.connect(audioCtx.destination);
          applyAudioTarget();
        } catch (err) {
          console.error('AudioWorklet init failed', err);
        }
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audioOverlay.style.display = 'none';
      console.log('Audio enabled by user gesture');
    });

    // Also allow clicking anywhere on the overlay.
    audioOverlay.addEventListener('click', (e) => {
      if (e.target === audioOverlay) {
        enableAudioBtn.click();
      }
    });

    let fallbackSeq = 0; // for old APKs that send no sequence number

    function setupAudioPlayback(dc) {
      dc.onopen = () => {
        console.log('audio-pcm data channel open');
      };
      dc.onclose = () => {
        console.log('audio-pcm data channel closed');
        fallbackSeq = 0;
        audioWorkletNode?.port.postMessage({ type: 'reset' });
      };
      dc.onerror = (err) => {
        console.error('audio-pcm data channel error', err);
        fallbackSeq = 0;
        audioWorkletNode?.port.postMessage({ type: 'reset' });
      };

      dc.onmessage = (e) => {
        // Audio not enabled yet (no user gesture) — silently drop chunks.
        if (!audioCtx || audioCtx.state !== 'running' || !audioWorkletNode) {
          return;
        }

        const buffer = e.data;
        if (!(buffer instanceof ArrayBuffer) || buffer.byteLength < 8 + BYTES_PER_CHUNK) {
          console.warn('audio-pcm received unexpected message', buffer);
          return;
        }

        const view = new DataView(buffer);
        // New format: int32 seq + int64 timestamp + PCM.
        // Old format: int64 timestamp + PCM (synthesize a local sequence).
        let seq;
        let pcmOffset;
        if (buffer.byteLength >= 12 + BYTES_PER_CHUNK) {
          seq = view.getInt32(0, true);
          pcmOffset = 12;
        } else {
          seq = fallbackSeq++;
          pcmOffset = 8;
        }

        const pcm16 = new Int16Array(buffer, pcmOffset, SAMPLES_PER_10MS * CHANNELS);

        const left = new Float32Array(SAMPLES_PER_10MS);
        const right = new Float32Array(SAMPLES_PER_10MS);
        for (let i = 0; i < SAMPLES_PER_10MS; i++) {
          left[i] = pcm16[i * 2] / 32768.0;
          right[i] = pcm16[i * 2 + 1] / 32768.0;
        }

        audioWorkletNode.port.postMessage({ type: 'push', seq, left, right });
      };
    }

    async function connect() {
      setStatus('connecting', 'Connecting...');

      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const streamId = pathParts[pathParts.length - 1] || '';
      const token = new URLSearchParams(window.location.search).get('token') || '';

      if (!streamId || !token) {
        setStatus('offline', 'Invalid link');
        return;
      }

      let iceConfig;
      try {
        const res = await fetch('/ice-config');
        iceConfig = await res.json();
      } catch (e) {
        console.error('Failed to fetch ICE config', e);
        iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
      }

      const pc = new RTCPeerConnection(iceConfig);

      pc.ondatachannel = (event) => {
        const dc = event.channel;
        if (dc.label === 'audio-pcm') {
          setupAudioPlayback(dc);
        }
      };

      const ws = new WebSocket(`${window.location.protocol.replace('http', 'ws')}//${window.location.host}/ws/viewer/${streamId}?token=${token}`);

      ws.onopen = () => {
        console.log('viewer websocket open');
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        console.log('ws message', msg.type);
        if (msg.type === 'offer') {
          console.log('received offer');
          await pc.setRemoteDescription(new RTCSessionDescription(msg));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          console.log('sending answer');
          ws.send(JSON.stringify(answer));
        } else if (msg.type === 'candidate') {
          console.log('adding ice candidate');
          await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
        } else if (msg.type === 'viewer-disconnected') {
          setStatus('offline', 'Stream ended');
        }
      };

      ws.onclose = () => {
        setStatus('offline', 'Disconnected');
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
      };

      pc.ontrack = (event) => {
        console.log('ontrack', event.track?.kind, event.streams);
        if (event.track?.kind !== 'video') return;
        // The sender adds transceivers without a MediaStream, so event.streams is
        // empty — fall back to wrapping the track in our own MediaStream.
        const stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
        // Set srcObject once; re-setting it would interrupt playback (AbortError).
        if (video.srcObject !== stream) {
          video.srcObject = stream;
        }

        event.track.onmute = () => console.log('track muted');
        event.track.onunmute = () => {
          console.log('track unmuted');
          setStatus('live', 'LIVE');
          latencyEl.style.display = 'block';
        };
      };

      video.addEventListener('click', safePlay);

      pc.onconnectionstatechange = () => {
        console.log('PC state', pc.connectionState);
        if (pc.connectionState === 'connected') {
          setStatus('connected', 'Connected');
          setTimeout(() => setStatus('live', 'LIVE'), 1000);
          startStats(pc);
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          setStatus('offline', 'Connection lost');
        }
      };
    }

    function startStats(pc) {
      setInterval(async () => {
        const stats = await pc.getStats();
        stats.forEach((report) => {
          if (report.type === 'inbound-rtp' && report.kind === 'video') {
            console.log('stats inbound video', report);
          }
          if (report.type === 'track' && report.kind === 'video') {
            console.log('stats track', report);
          }
        });
      }, 3000);
    }

    connect();
  </script>
</body>
</html>
