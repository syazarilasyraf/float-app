<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOMSTREAM Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100%;
      overflow: hidden;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #111;
      border-bottom: 1px solid #333;
    }
    #status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #666;
    }
    #status-dot.live { background: #ff3b30; box-shadow: 0 0 6px #ff3b30; }
    #status-dot.connecting { background: #ffcc00; }
    #status-dot.connected { background: #34c759; }
    #video-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }
    button {
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button:active { background: rgba(255,255,255,0.15); }
    #latency {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #ccc;
      display: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="header">
      <div id="status"><span id="status-dot"></span><span id="status-text">Offline</span></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#888;">
        <label for="syncSlider">Audio sync</label>
        <input type="range" id="syncSlider" min="-500" max="500" step="10" value="0" style="width:100px;">
        <span id="syncValue">0ms</span>
        <span style="margin-left:8px;">ZOMSTREAM</span>
      </div>
    </div>
    <div id="video-wrap">
      <video id="remoteVideo" autoplay playsinline muted></video>
      <div id="latency">Latency: -- ms</div>
      <div id="controls">
        <button id="fitBtn">Fill</button>
        <button id="muteBtn">Unmute</button>
        <button id="fullscreenBtn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const video = document.getElementById('remoteVideo');
    const latencyEl = document.getElementById('latency');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fitBtn = document.getElementById('fitBtn');
    const muteBtn = document.getElementById('muteBtn');

    let fitMode = 'contain';
    fitBtn.textContent = 'Fill';
    fitBtn.addEventListener('click', () => {
      fitMode = fitMode === 'contain' ? 'cover' : 'contain';
      video.style.objectFit = fitMode;
      fitBtn.textContent = fitMode === 'contain' ? 'Fill' : 'Fit';
    });

    function setStatus(state, text) {
      statusDot.className = '';
      statusDot.classList.add(state);
      statusText.textContent = text;
    }

    fullscreenBtn.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    });

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? 'Unmute' : 'Mute';
      video.play().catch((e) => console.error('unmute play failed', e));
    });

    // Anchor for timestamp-based scheduling: chunks are spaced by their capture
    // time on the phone, not by arrival time, so audio stays true to the source.
    let firstCaptureTime = null;
    let firstPlayTime = null;

    let syncOffsetMs = 0; // user-adjustable A/V sync offset

    const syncSlider = document.getElementById('syncSlider');
    const syncValue = document.getElementById('syncValue');

    syncSlider.addEventListener('input', () => {
      syncOffsetMs = parseInt(syncSlider.value, 10);
      syncValue.textContent = `${syncOffsetMs}ms`;
      // Reset the anchor so the next chunk recalculates firstPlayTime with the new offset.
      firstCaptureTime = null;
      firstPlayTime = null;
    });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    const SAMPLE_RATE = 48000;
    const CHANNELS = 2;
    const SAMPLES_PER_10MS = SAMPLE_RATE / 100;
    const BYTES_PER_CHUNK = SAMPLES_PER_10MS * CHANNELS * 2;

    function setupAudioPlayback(dc) {
      dc.onopen = () => {
        console.log('audio-pcm data channel open');
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch((err) => console.error('audio resume failed', err));
        }
      };
      dc.onclose = () => {
        console.log('audio-pcm data channel closed');
        firstCaptureTime = null;
        firstPlayTime = null;
      };
      dc.onerror = (err) => {
        console.error('audio-pcm data channel error', err);
        firstCaptureTime = null;
        firstPlayTime = null;
      };

      dc.onmessage = (e) => {
        const buffer = e.data;
        if (!(buffer instanceof ArrayBuffer) || buffer.byteLength < 8 + BYTES_PER_CHUNK) {
          console.warn('audio-pcm received unexpected message', buffer);
          return;
        }

        const view = new DataView(buffer);
        const timestampNs = view.getBigInt64(0, true);
        const pcmBytes = new Uint8Array(buffer, 8);

        const pcm16 = new Int16Array(pcmBytes.buffer, pcmBytes.byteOffset, pcmBytes.byteLength / 2);
        const float32 = new Float32Array(pcm16.length);
        for (let i = 0; i < pcm16.length; i++) {
          float32[i] = pcm16[i] / 32768.0;
        }

        if (firstCaptureTime === null) {
          firstCaptureTime = Number(timestampNs);
          firstPlayTime = audioCtx.currentTime + 0.03 + (syncOffsetMs / 1000); // 30ms initial buffer
        }

        const relativeSec = (Number(timestampNs) - firstCaptureTime) / 1e9;
        const playTime = firstPlayTime + relativeSec;

        // Drop chunks that are already in the past (they would glitch on start).
        if (playTime < audioCtx.currentTime) {
          return;
        }

        const audioBuffer = audioCtx.createBuffer(CHANNELS, SAMPLES_PER_10MS, SAMPLE_RATE);
        const left = audioBuffer.getChannelData(0);
        const right = audioBuffer.getChannelData(1);
        for (let i = 0; i < SAMPLES_PER_10MS; i++) {
          left[i] = float32[i * 2];
          right[i] = float32[i * 2 + 1];
        }

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        source.start(playTime);
      };
    }

    async function connect() {
      setStatus('connecting', 'Connecting...');

      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const streamId = pathParts[pathParts.length - 1] || '';
      const token = new URLSearchParams(window.location.search).get('token') || '';

      if (!streamId || !token) {
        setStatus('offline', 'Invalid link');
        return;
      }

      let iceConfig;
      try {
        const res = await fetch('/ice-config');
        iceConfig = await res.json();
      } catch (e) {
        console.error('Failed to fetch ICE config', e);
        iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
      }

      const pc = new RTCPeerConnection(iceConfig);

      pc.ondatachannel = (event) => {
        const dc = event.channel;
        if (dc.label === 'audio-pcm') {
          setupAudioPlayback(dc);
        }
      };

      const ws = new WebSocket(`${window.location.protocol.replace('http', 'ws')}//${window.location.host}/ws/viewer/${streamId}?token=${token}`);

      ws.onopen = () => {
        console.log('viewer websocket open');
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        console.log('ws message', msg.type);
        if (msg.type === 'offer') {
          console.log('received offer');
          await pc.setRemoteDescription(new RTCSessionDescription(msg));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          console.log('sending answer');
          ws.send(JSON.stringify(answer));
        } else if (msg.type === 'candidate') {
          console.log('adding ice candidate');
          await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
        } else if (msg.type === 'viewer-disconnected') {
          setStatus('offline', 'Stream ended');
        }
      };

      ws.onclose = () => {
        setStatus('offline', 'Disconnected');
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
      };

      pc.ontrack = (event) => {
        console.log('ontrack', event.track?.kind, event.streams);
        const stream = (event.streams && event.streams[0]) ? event.streams[0] : (event.track ? new MediaStream([event.track]) : null);
        if (!stream) return;

        video.muted = true;
        video.srcObject = stream;
        video.play().catch((e) => {
          console.error('video.play() failed', e);
          setStatus('offline', 'Tap video to play');
        });

        event.track.onmute = () => console.log('track muted');
        event.track.onunmute = () => {
          console.log('track unmuted');
          setStatus('live', 'LIVE');
          latencyEl.style.display = 'block';
        };
      };

      video.addEventListener('click', () => {
        video.play().catch((e) => console.error('click play failed', e));
      });

      pc.onconnectionstatechange = () => {
        console.log('PC state', pc.connectionState);
        if (pc.connectionState === 'connected') {
          setStatus('connected', 'Connected');
          setTimeout(() => setStatus('live', 'LIVE'), 1000);
          startStats(pc);
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          setStatus('offline', 'Connection lost');
        }
      };
    }

    function startStats(pc) {
      setInterval(async () => {
        const stats = await pc.getStats();
        stats.forEach((report) => {
          if (report.type === 'inbound-rtp' && report.kind === 'video') {
            console.log('stats inbound video', report);
          }
          if (report.type === 'track' && report.kind === 'video') {
            console.log('stats track', report);
          }
        });
      }, 3000);
    }

    connect();
  </script>
</body>
</html>
